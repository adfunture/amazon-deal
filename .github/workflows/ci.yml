name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sbc
          POSTGRES_PASSWORD: sbc
          POSTGRES_DB: sbc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sbc" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      PGPASSWORD: sbc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check sbc tests
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: python -m pytest -q --ignore=tests/test_migrations.py
        env:
          TEST_DATABASE_URL: postgresql://sbc:sbc@localhost:5432/sbc_test
      - name: Migrationen gegen leeres PostgreSQL
        run: |
          psql -h localhost -U sbc -d sbc_test -c "CREATE DATABASE sbc_migrations"
          DATABASE_URL=postgresql://sbc:sbc@localhost:5432/sbc_migrations APP_ENV=test alembic upgrade head
          DATABASE_URL=postgresql://sbc:sbc@localhost:5432/sbc_migrations APP_ENV=test alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
